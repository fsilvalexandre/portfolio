<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria | RePercussion Trio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header>
<nav class="navbar">
<a href="index.html" class="logo">
<img src="imagens/logotipo.png" alt="RePercussion Trio">
</a>

<ul class="nav-links">
<li><a href="index.html" data-translate="navbar.home">Página Inicial</a></li>
<li><a href="sobre.html" data-translate="navbar.about">Sobre Nós</a></li>
<li><a href="repertorio.html" data-translate="navbar.repertoire">Repertório</a></li>
<li><a href="galeria.html" class="active" data-translate="navbar.gallery">Galeria</a></li>
<li><a href="agenda.html" data-translate="navbar.agenda">Agenda</a></li>
<li><a href="contactos.html" data-translate="navbar.contact">Contactos</a></li>
</ul>

<!-- Language Selector - Desktop -->
<div class="language-selector">
  <button class="language-btn active" data-lang="pt" onclick="changeLanguage('pt')">PT</button>
  <button class="language-btn" data-lang="en" onclick="changeLanguage('en')">EN</button>
</div>

<button class="hamburger" id="hamburger">
  <span></span>
  <span></span>
  <span></span>
</button>

<div class="socials">
<a href="https://facebook.com/repercussiontrio" target="_blank" aria-label="Facebook">
<i class="fab fa-facebook-f"></i>
</a>
<a href="https://instagram.com/repercussiontrio" target="_blank" aria-label="Instagram">
<i class="fab fa-instagram"></i>
</a>
<a href="https://youtube.com/@repercussiontrio" target="_blank" aria-label="YouTube">
<i class="fab fa-youtube"></i>
</a>
</div>
</nav>

<!-- Menu Mobile Overlay -->
<div class="mobile-menu" id="mobile-menu">
  <div class="mobile-menu-content">
    <!-- Language Selector - Mobile -->
    <div class="mobile-language-selector">
      <button class="language-btn active" data-lang="pt" onclick="changeLanguage('pt')">PT</button>
      <button class="language-btn" data-lang="en" onclick="changeLanguage('en')">EN</button>
    </div>

    <!-- Links de navegação -->
    <ul class="mobile-nav-links">
      <li><a href="index.html" data-translate="navbar.home">Página Inicial</a></li>
      <li><a href="sobre.html" data-translate="navbar.about">Sobre Nós</a></li>
      <li><a href="repertorio.html" data-translate="navbar.repertoire">Repertório</a></li>
      <li><a href="galeria.html" data-translate="navbar.gallery">Galeria</a></li>
      <li><a href="agenda.html" data-translate="navbar.agenda">Agenda</a></li>
      <li><a href="contactos.html" data-translate="navbar.contact">Contactos</a></li>
    </ul>

    <!-- Socials no rodapé -->
    <div class="mobile-socials">
      <a href="https://facebook.com/repercussiontrio" target="_blank" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="https://instagram.com/repercussiontrio" target="_blank" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://youtube.com/@repercussiontrio" target="_blank" aria-label="YouTube">
        <i class="fab fa-youtube"></i>
      </a>
    </div>
  </div>
</div>
</header>

<main>
<div class="page-content">
<h1 class="page-title" data-translate="gallery.pageTitle">Galeria</h1>

<!-- Masonry Gallery -->
<div class="gallery-masonry" id="gallery-masonry">
<!-- Items loaded by galeria.js -->
</div>
</div>
</main>

<!-- Lightbox Modal para Fotos -->
<div class="lightbox" id="lightbox">
<span class="lightbox-close">&times;</span>
<img class="lightbox-image" id="lightbox-image" src="" alt="">
<div class="lightbox-nav">
  <button class="lightbox-prev" id="lightbox-prev">‹</button>
  <button class="lightbox-next" id="lightbox-next">›</button>
</div>
</div>

<!-- YouTube Modal para Vídeos -->
<div class="youtube-modal" id="youtube-modal">
<span class="youtube-close">&times;</span>
<div class="youtube-container">
  <iframe id="youtube-iframe" width="100%" height="100%" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>
</div>

<script src="js/translations.js"></script>
<script src="js/galeria.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
