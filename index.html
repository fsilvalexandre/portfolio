<div class="floating-concert" id="floating-concert">
<div class="floating-concert-label">Próximo Concerto</div>
<div class="floating-concert-date" id="fc-day">—</div>
<div class="floating-concert-month" id="fc-month">—</div>
<div class="floating-concert-title" id="fc-title">Carregando...</div>
<div class="floating-concert-time" id="fc-time">—</div>
<div class="floating-concert-location" id="fc-location">—</div>
<a href="agenda.html" class="floating-concert-link">Ver Agenda</a>
</div>

<script src="js/shared-events.js"></script>
<script>
getNextConcert().then(concert => {
    const floatingConcert = document.getElementById('floating-concert');
    
    if (concert) {
        document.getElementById('fc-day').textContent = concert.day;
        document.getElementById('fc-month').textContent = concert.month;
        document.getElementById('fc-title').textContent = concert.title;
        document.getElementById('fc-time').textContent = concert.time;
        document.getElementById('fc-location').textContent = concert.location;
        floatingConcert.style.display = 'block';  // ← Mostra se há evento
    } else {
        floatingConcert.style.display = 'none';  // ← Esconde se não há
    }
});
</script>
