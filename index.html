<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RePercussion Trio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-home">
      <a href="index.html" class="logo">
        <img src="imagens/logotipo.png" alt="RePercussion Trio">
      </a>

      <ul class="nav-links">
        <li><a href="index.html" data-translate="navbar.home">Página Inicial</a></li>
        <li><a href="sobre.html" data-translate="navbar.about">Sobre Nós</a></li>
        <li><a href="repertorio.html" data-translate="navbar.repertoire">Repertório</a></li>
        <li><a href="galeria.html" data-translate="navbar.gallery">Galeria</a></li>
        <li><a href="agenda.html" data-translate="navbar.agenda">Agenda</a></li>
        <li><a href="contactos.html" data-translate="navbar.contact">Contactos</a></li>
      </ul>

      <!-- Language Selector - Desktop -->
      <div class="language-selector">
        <button class="language-btn active" data-lang="pt" onclick="changeLanguage('pt')">PT</button>
        <button class="language-btn" data-lang="en" onclick="changeLanguage('en')">EN</button>
      </div>

      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="socials">
        <a href="https://facebook.com/repercussiontrio" target="_blank" aria-label="Facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https://instagram.com/repercussiontrio" target="_blank" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://youtube.com/@repercussiontrio" target="_blank" aria-label="YouTube">
          <i class="fab fa-youtube"></i>
        </a>
      </div>
    </nav>

    <!-- Menu Mobile Overlay -->
    <div class="mobile-menu" id="mobile-menu">
      <div class="mobile-menu-content">
        <!-- Language Selector - Mobile -->
        <div class="mobile-language-selector">
          <button class="language-btn active" data-lang="pt" onclick="changeLanguage('pt')">PT</button>
          <button class="language-btn" data-lang="en" onclick="changeLanguage('en')">EN</button>
        </div>

        <!-- Links de navegação -->
        <ul class="mobile-nav-links">
          <li><a href="index.html" data-translate="navbar.home">Página Inicial</a></li>
          <li><a href="sobre.html" data-translate="navbar.about">Sobre Nós</a></li>
          <li><a href="repertorio.html" data-translate="navbar.repertoire">Repertório</a></li>
          <li><a href="galeria.html" data-translate="navbar.gallery">Galeria</a></li>
          <li><a href="agenda.html" data-translate="navbar.agenda">Agenda</a></li>
          <li><a href="contactos.html" data-translate="navbar.contact">Contactos</a></li>
        </ul>

        <!-- Socials no rodapé -->
        <div class="mobile-socials">
          <a href="https://facebook.com/repercussiontrio" target="_blank" aria-label="Facebook">
            <i class="fab fa-facebook-f"></i>
          </a>
          <a href="https://instagram.com/repercussiontrio" target="_blank" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
          </a>
          <a href="https://youtube.com/@repercussiontrio" target="_blank" aria-label="YouTube">
            <i class="fab fa-youtube"></i>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
<picture>
  <source media="(max-width: 768px)" srcset="imagens/foto-principal-mobile.jpg">
  <img
    src="imagens/foto-principal.jpg"
    alt="RePercussion Trio"
    class="hero-img"
    onload="this.classList.add('loaded')"
  >
</picture>
      <div class="hero-text">
        <h1 data-translate="home.title">RePercussion Trio</h1>
        <p data-translate="home.subtitle"> Trio de percussão contemporâneo</p>
      </div>
    </section>
  </main>

  <!-- Floating Concert Card -->
  <div class="floating-concert" id="floating-concert">
    <div class="floating-concert-label" data-translate="floatingConcert.label">Próximo Concerto</div>
    <div class="floating-concert-date" id="concert-day">--</div>
    <div class="floating-concert-month" id="concert-month">---</div>
    <div class="floating-concert-title" id="concert-title">--</div>
    <div class="floating-concert-time" id="concert-time">--:--</div>
    <div class="floating-concert-location" id="concert-location">--</div>
    <a href="agenda.html" class="floating-concert-link" data-translate="navbar.agenda">Agenda</a>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/shared-events.js"></script>

</body>

</html>
